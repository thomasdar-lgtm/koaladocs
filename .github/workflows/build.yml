name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'


      # Le moteur Android des tests (Robolectric) se télécharge parfois mal : on le met en cache
      # et on le télécharge nous-mêmes, avec plusieurs essais.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1-sdk34
      - name: Robolectric
        run: |
          D=~/.m2/repository/org/robolectric/android-all-instrumented/14-robolectric-10818077-i7
          F=$D/android-all-instrumented-14-robolectric-10818077-i7.jar
          if [ ! -s "$F" ]; then
            mkdir -p $D
            curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o "$F" https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/14-robolectric-10818077-i7/android-all-instrumented-14-robolectric-10818077-i7.jar
            curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o "${F%.jar}.pom" https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/14-robolectric-10818077-i7/android-all-instrumented-14-robolectric-10818077-i7.pom
          fi
          ls -la $D

      - name: Build
        run: gradle testDebugUnitTest assembleRelease --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Prepare APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk Koaladocs.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Koaladocs-${{ env.VERSION }}
          path: Koaladocs.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Koaladocs ${{ env.VERSION }}
          files: Koaladocs.apk
          make_latest: true

      - name: Report
        if: always()
        run: |
          RESULT="${{ job.status }}"
          mkdir -p /tmp/report
          echo "$RESULT ${GITHUB_SHA}" > /tmp/report/status.txt
          if [ -f build.log ]; then
            grep -E "^e: |error:|FAILURE|FAILED|Test.*>|AssertionError|Expected|What went wrong|BUILD (SUCCESSFUL|FAILED)|\.kt:[0-9]+|\.xml:[0-9]+|AAPT|Could not" build.log | head -200 > /tmp/report/errors.txt || true
            tail -150 build.log > /tmp/report/tail.txt
            cp app/build/shots/*.png /tmp/report/ 2>/dev/null || true
          fi
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && grep -o '<testsuite [^>]*>' "$f"; grep -o '<testcase name="[^"]*"' "$f"; grep -A3 '<failure' "$f" | head -20; done > /tmp/report/tests.txt 2>/dev/null || true
          cd /tmp/report
          git init -q -b build-logs
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "$RESULT ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
